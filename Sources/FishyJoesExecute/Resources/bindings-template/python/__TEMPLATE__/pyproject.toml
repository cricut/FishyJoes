# __AUTOGEN_WARNING__

[project]
name = "__PYTHON_DISTRIBUTION_NAME__"
version = "__PYTHON_PACKAGE_VERSION__"
description = "Python bindings generated by FishyJoes for __MODULE_NAME__"
requires-python = ">=3.11"
dependencies = [
__PYTHON_DEPENDENCIES__
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Development builds against a local-path dependency express it as a PEP 508
# direct reference (name @ file:///…); allow the build backend to accept it.
# Published wheels never contain direct references (pack rejects filesystem,
# branch, and revision dependencies without a concrete version requirement).
allow-direct-references = true

[pytest]
testpaths = ["../test"]

[dependency-groups]
dev = [
  "mypy>=2.3.0,<3",
  "pyrefly>=1.1.1,<2",
  "pytest>=9.1.1,<10",
]


[tool.hatch.build.targets.wheel]
packages = ["src/__PYTHON_IMPORT_PACKAGE__"]
artifacts = ["native/*"]

[tool.mypy]
strict = true
