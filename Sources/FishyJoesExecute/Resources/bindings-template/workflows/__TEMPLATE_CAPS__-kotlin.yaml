---
# __AUTOGEN_WARNING__

name: "__WORKFLOW_NAME_PREFIX__Kotlin"

"on":
  workflow_dispatch:
  label:
    types: [created]
  pull_request:__PULL_REQUEST_PATHS__
  __RELEASE_TRIGGER__

__WORKFLOW_DEFAULTS__concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}-__WORKFLOW_NAME_PREFIX__Kotlin__CONCURRENCY_SUFFIX__
  cancel-in-progress: true

env:
  __CI_SHARED_ENV_YAML__

jobs:
  build-test-kotlin-mac:
    name: "macOS: Build and test kotlin bindings"__BUILD_JOB_CONDITION__
    runs-on: __CI_RUNNER_MACOS__
    steps:
      - __CI_GIT_STEPS__

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: zulu

      # NOTE: don't delete this. Even if it looks unused, some downsteam pre-build hooks rely on it.
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com/'

      __KOTLIN_LOCAL_DEPENDENCY_STEPS__- name: Pre-build hook
        shell: bash
        run: __PRE_BUILD_HOOK_YAML__

      - name: Build library
        shell: zsh {0}
        run: |
          set -euxo pipefail

          swift run -- fishy-joes --kotlin-fast --fat build

      - name: Post-build hook
        shell: bash
        run: __POST_BUILD_HOOK_YAML__

      - name: Test from gradle
        shell: zsh {0}
        run: |
          set -euxo pipefail

          swift run -- fishy-joes --kotlin-fast --fat test

      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: __ARTIFACT_PREFIX__mac_libs
          path: __PACKAGE_DIR__bindings/kotlin/generated/src/main/resources
          if-no-files-found: error__KOTLIN_LOCAL_DEPENDENCY_CLEANUP__

  build-test-kotlin-linux:
    name: "Ubuntu: Build and test kotlin bindings"__BUILD_JOB_CONDITION__
    runs-on: __CI_RUNNER_UBUNTU__
    steps:
      - __CI_GIT_STEPS__

      - name: Set up Swift
        uses: vapor/swiftly-action@bedb227456c5f495afbef80baebee17a8a02cef4  # v0.2.1
        with:
          toolchain: __CI_SWIFT_LINUX_TOOLCHAIN__

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: zulu

      # NOTE: don't delete this. Even if it looks unused, some downsteam pre-build hooks rely on it.
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com/'

      - name: Install tools
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y zsh libcurl4-openssl-dev
          # "sdkmanager" for ubuntu 22.04, "google-android-cmdline-tools-13.0-installer" for ubuntu 24.04
          sudo apt-get install -y sdkmanager pkg-config python3-lldb-13 ||
            sudo apt-get install -y google-android-cmdline-tools-13.0-installer

          # https://developer.android.com/studio/projects/install-ndk#install_ndk_and_cmake_automatically
          ( yes || true ) | sudo sdkmanager --licenses >/dev/null
          swift run fishy-joes install-system-dependencies for-android

      __KOTLIN_LOCAL_DEPENDENCY_STEPS__- name: Pre-build hook
        shell: bash
        run: __PRE_BUILD_HOOK_YAML__

      - name: Build library
        shell: zsh {0}
        run: |
          set -euxo pipefail

          swift run -- fishy-joes --kotlin build

      - name: Post-build hook
        shell: bash
        run: __POST_BUILD_HOOK_YAML__

      - name: Patch libraries to use relative dependencies
        shell: zsh {0}
        run: |
          set -euxo pipefail

          cd bindings/kotlin/generated/src/main/resources/linux

          SWIFT_RUN_PATH='$ORIGIN:/usr/lib/swift/linux:'
          for LIB in lib*.so*; do
            patchelf --set-rpath $SWIFT_RUN_PATH $LIB
          done

      - name: Test from gradle
        shell: zsh {0}
        run: |
          set -euxo pipefail

          swift run -- fishy-joes --kotlin test

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: __ARTIFACT_PREFIX__ubuntu_libs
          path: __PACKAGE_DIR__bindings/kotlin/generated/src/main/resources
          if-no-files-found: error__KOTLIN_LOCAL_DEPENDENCY_CLEANUP__

  build-test-kotlin-windows:
    name: "Windows: Build and test kotlin bindings"__BUILD_JOB_CONDITION__
    runs-on: __CI_RUNNER_WINDOWS__
    steps:
      - name: Configure git and vcpkg
        shell: pwsh
        # The default working directory of a package in a subdirectory doesn't exist before checkout.
        working-directory: .
        run: |
          git config --system core.longpaths true
          echo "VCPKG_ROOT=$(Split-Path -Parent $((gcm vcpkg).Path))" >> $env:GITHUB_ENV

      - __CI_GIT_STEPS__

      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5  # v0.4.0
        with:
          swift-version: __CI_SWIFT_WINDOWS_BRANCH__
          swift-build: __CI_SWIFT_WINDOWS_BUILD__

      - name: Pre-resolve required swiftpm packages & fetch fishyjoes scripts
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          swift package resolve
          swift package resolve
          swift package resolve
          echo SWIFT_WINDOWS_BASH=".build/checkouts/FishyJoes/scripts/swift-shim.ps1" >> $env:GITHUB_ENV

      # NOTE: don't delete this. Even if it looks unused, some downsteam pre-build hooks rely on it.
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com/'

      __KOTLIN_LOCAL_DEPENDENCY_STEPS__- name: Pre-build hook
        shell: bash
        run: __PRE_BUILD_HOOK_YAML__

      - name: Build library
        shell: bash
        run: |
          set -euxo pipefail

          "$SWIFT_WINDOWS_BASH" run -- fishy-joes --kotlin-fast build

      - name: Post-build hook
        shell: bash
        run: __POST_BUILD_HOOK_YAML__

      # NOTE: Performing this step earlier seems to cause the build to fail, likely due to the Swift install step & path issues
      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: zulu

      - name: Test library from gradle
        shell: bash
        run: |
          set -euxo pipefail

          "$SWIFT_WINDOWS_BASH" run -- fishy-joes --kotlin-fast test

      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: __ARTIFACT_PREFIX__windows_libs
          path: __PACKAGE_DIR__bindings/kotlin/generated/src/main/resources
          if-no-files-found: error__KOTLIN_LOCAL_DEPENDENCY_CLEANUP__

  kotlin-publish:
    name: Publish kotlin package
    runs-on: __CI_RUNNER_UBUNTU__
    needs:
      - build-test-kotlin-mac
      - build-test-kotlin-linux
      - build-test-kotlin-windows
    if: __PUBLISH_JOB_CONDITION__
    env:
      GITHUB_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - __CI_GIT_STEPS__

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: zulu

      - name: Configure build environment
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Retrieve artifacts
        uses: actions/download-artifact@v4
        with:
          # Only the libraries of this package, the release workflow builds several packages in the same run.
          pattern: '__ARTIFACT_PREFIX__*_libs'
          path: __PACKAGE_DIR__.

      - name: Install artifacts
        shell: zsh {0}
        run: |
          set -euxo pipefail

          ls *

          mkdir -p bindings/kotlin/generated/src/main/resources/

          mv __ARTIFACT_PREFIX__mac_libs/mac bindings/kotlin/generated/src/main/resources/
          mv __ARTIFACT_PREFIX__windows_libs/windows bindings/kotlin/generated/src/main/resources/
          mv __ARTIFACT_PREFIX__ubuntu_libs/linux bindings/kotlin/generated/src/main/resources/
          mv __ARTIFACT_PREFIX__ubuntu_libs/lib bindings/kotlin/generated/src/main/resources/

      __KOTLIN_LOCAL_DEPENDENCY_STEPS__- name: Test publish
        shell: zsh {0}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euxo pipefail

          cd bindings/kotlin/generated
          # The version of a release, which the packages depending on this one resolve from the Maven local repository
          # when they're released in the same run (see the workflow_call trigger).
          if [[ -n "$INPUT_VERSION" ]]; then
              export VERSION="$INPUT_VERSION"
              ./gradlew updateVersion
          fi
          ./gradlew publishToMavenLocal

      __KOTLIN_MAVEN_LOCAL_UPLOAD__- name: Publish
        shell: zsh {0}
        if: __PUBLISH_CONDITION__
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euxo pipefail

          VERSION=${GITHUB_REF#refs/*/}__STRIP_TAG_PREFIX__
          VERSION=${INPUT_VERSION:-$VERSION}
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              if [[ -n "$INPUT_VERSION" ]]; then
                  echo "Unsupported version '$INPUT_VERSION'" >&2
                  exit 1
              fi
              VERSION="0.0.1-$(git rev-parse --short HEAD)"
          fi

          cd bindings/kotlin/generated

          echo "Detected Version is '$VERSION'"

          # A re-run of a partially published release skips what exists.
          GROUP=$(sed -n 's/^group=//p' gradle.properties)
          ARTIFACT=$(sed -n 's/^artifact=//p' gradle.properties)
          POM_URL="https://maven.pkg.github.com/$GITHUB_REPOSITORY/${GROUP//.//}/$ARTIFACT/$VERSION/$ARTIFACT-$VERSION.pom"
          if curl -sfI -o /dev/null -u "$GITHUB_ACTOR:$GITHUB_PUBLISH_TOKEN" "$POM_URL"; then
              echo "$GROUP:$ARTIFACT:$VERSION is already published"
              exit 0
          fi

          export VERSION
          ./gradlew updateVersion
          ./gradlew assemble publish
