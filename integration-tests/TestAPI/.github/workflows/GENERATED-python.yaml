---
# THIS FILE IS AUTOMATICALLY GENERATED, AND WILL BE OVERWRITTEN. DO NOT EDIT.

name: "Python"

"on":
  workflow_dispatch:
  label:
    types: [created]
  pull_request:
  release:
    types: [published]

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: '8.0.x'
  FISHYJOES: '1'
  FISHYJOES_PREFER_RESOLVED_LOCAL_DEPS: '1'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  JAVA_VERSION: '20'
  NODE_VERSION: '18.x'

jobs:
  build-test-python-mac:
    name: "macOS: Build and test python bindings"
    runs-on: macos-26
    steps:
      - name: Pre-checkout hook
        shell: bash
        run: |
          set -euxo pipefail
          echo "PRE CHECKOUT hook"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # NOTE: don't delete this. Even if it looks unused, some downsteam pre-build hooks rely on it.
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com/'

      - name: Install generation tools
        shell: zsh {0}
        run: |
          set -euxo pipefail
          uv --version || brew install uv
          yq --version || brew install yq
          mint --version || brew install mint

      - name: Pre-build hook
        shell: bash
        run: |
          set -euxo pipefail
          echo "PRE BUILD hook"

      - name: Build library
        shell: zsh {0}
        run: |
          set -euxo pipefail

          swift run -- fishy-joes --python --fat generate build

      - name: Post-build hook
        shell: bash
        run: |
          set -euxo pipefail
          echo "POST BUILD hook"

      - name: Test library from pytest
        shell: zsh {0}
        run: |
          set -euxo pipefail

          swift run -- fishy-joes --python --fat test

      - name: Pack
        shell: zsh {0}
        run: |
          set -euxo pipefail

          swift run -- fishy-joes --python --fat pack

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-macos-wheel
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  build-test-python-linux:
    name: "Ubuntu: Build and test python bindings"
    runs-on: ubuntu-22.04
    steps:
      - name: Pre-checkout hook
        shell: bash
        run: |
          set -euxo pipefail
          echo "PRE CHECKOUT hook"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Swift
        uses: vapor/swiftly-action@bedb227456c5f495afbef80baebee17a8a02cef4  # v0.2.1
        with:
          toolchain: 6.3.3

      - name: Pre-build hook
        shell: bash
        run: |
          set -euxo pipefail
          echo "PRE BUILD hook"

      - name: Build library
        shell: zsh {0}
        run: |
          set -euxo pipefail

          swift run -- fishy-joes --python --fat generate build

      - name: Post-build hook
        shell: bash
        run: |
          set -euxo pipefail
          echo "POST BUILD hook"

      - name: Test library from pytest
        shell: zsh {0}
        run: |
          set -euxo pipefail

          swift run -- fishy-joes --python --fat test

      - name: Pack
        shell: zsh {0}
        run: |
          set -euxo pipefail

          swift run -- fishy-joes --python --fat pack

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-ubuntu-wheel
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  build-test-python-windows:
    name: "Windows: Build and test python bindings"
    runs-on: windows-2025
    steps:
      - name: Configure git and vcpkg
        shell: pwsh
        run: |
          git config --system core.longpaths true
          echo "VCPKG_ROOT=$(Split-Path -Parent $((gcm vcpkg).Path))" >> $env:GITHUB_ENV

      - name: Pre-checkout hook
        shell: bash
        run: |
          set -euxo pipefail
          echo "PRE CHECKOUT hook"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5  # v0.4.0
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE

      - name: Pre-resolve required swiftpm packages and fetch fishyjoes scripts
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          swift package resolve
          swift package resolve
          swift package resolve
          echo SWIFT_WINDOWS_BASH=".build/checkouts/FishyJoes/scripts/swift-shim.ps1" >> $env:GITHUB_ENV

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com/'

      - name: Pre-build hook
        shell: bash
        run: |
          set -euxo pipefail
          echo "PRE BUILD hook"

      - name: Build library
        shell: bash
        run: |
          set -euxo pipefail

          "$SWIFT_WINDOWS_BASH" run -- fishy-joes --python --fat generate build

      - name: Post-build hook
        shell: bash
        run: |
          set -euxo pipefail
          echo "POST BUILD hook"

      - name: Test library from pytest
        shell: zsh {0}
        run: |
          set -euxo pipefail

          "$SWIFT_WINDOWS_BASH" run -- fishy-joes --python --fat test

      - name: Pack
        shell: bash
        run: |
          set -euxo pipefail

          "$SWIFT_WINDOWS_BASH" run -- fishy-joes --python --fat pack

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-windows-wheel
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  python-publish:
    name: "Publish python package"
    runs-on: ubuntu-22.04
    needs:
      - build-test-python-mac
      - build-test-python-linux
      - build-test-python-windows
    env:
      GITHUB_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Pre-checkout hook
        shell: bash
        run: |
          set -euxo pipefail
          echo "PRE CHECKOUT hook"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure build environment
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Retrieve artifacts
        uses: actions/download-artifact@v4

      - name: Install artifacts
        shell: zsh {0}
        run: |
          set -euxo pipefail

          ls *-wheel

          mkdir -p python/bindings/dist
          mv *-wheel/*.whl python/bindings/dist/
          ls python/bindings/dist/

      - name: Publish
        shell: zsh {0}
        # if: github.event_name == 'release'
        run: |
          set -euxo pipefail

          uv publish --dry-run
