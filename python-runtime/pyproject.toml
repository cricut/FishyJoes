[project]
name = "fishyjoes-runtime"
version = "0.0.1.dev0"
description = "Python-side FishyJoes binding layer for the shared Iota ABI"
requires-python = ">=3.11"
dependencies = [
    "cffi>=2.1.0,<3",
    "packaging>=26.2,<27",
]

[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build_hook.py"

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    "pyrefly>=1.1.1,<2",
    "pytest>=9.1.1,<10",
    "types-cffi>=2.0.0,<3",
]

# Type checkers
[tool.mypy]
strict = true

[tool.pyrefly]
preset = "strict"
