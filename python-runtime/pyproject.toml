[project]
name = "fishyjoes-runtime"
version = "0.0.1.dev0"
description = "Python-side FishyJoes binding layer for the shared Iota ABI"
requires-python = ">=3.11"
dependencies = [
    "cffi>=2.1.0,<3",
    "pyrefly>=0.60.2",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# module-name = "cricut.fishyjoes_runtime"
data = { data = "native" }

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    "pyrefly>=1.1.1,<2",
    "pytest>=9.1.1,<10",
    "types-cffi>=2.0.0,<3",
]

[tool.mypy]
strict = true
